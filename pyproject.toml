[project]
name = "tucknote"
version = "0.1.0"
description = "Thought Capture — spontaneous voice notes with active window context on Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.6.0",
    "faster-whisper>=1.0.0",
    "ctranslate2==4.4.0",
    "setuptools<70",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
tucknote = "tucknote.__main__:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
